name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .
      - run: uv run python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev --extra ui
      - run: uv run python -m playwright install --with-deps chromium
      - run: uv run python -m pytest tests/test_ui.py --ui -q
